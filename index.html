<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Leaf Byte Afinara - Technology That Grows, Solutions That Thrive</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6CBE45',
                        secondary: '#1D3B35'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Poppins (headers) and Roboto (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./Logo-2026-icon.png">
    <!-- Custom styles -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Language switcher -->
    <div class="fixed top-4 right-4 flex items-center rounded-full border border-gray-200 bg-white shadow-sm text-xs font-medium overflow-hidden">
        <button type="button" data-lang-btn="en" class="px-3 py-1.5 transition-colors">EN</button>
        <button type="button" data-lang-btn="id" class="px-3 py-1.5 transition-colors">ID</button>
    </div>

    <main class="min-h-screen flex flex-col items-center justify-center px-4 text-center">
        <img src="./Logo-2026-web.png" alt="PT Leaf Byte Afinara" class="h-28 md:h-32 w-auto mb-8">
        <h1 data-i18n="tagline" class="text-3xl md:text-4xl font-bold text-secondary leading-tight">Technology That Grows, Solutions That Thrive</h1>
        <p data-i18n="lede" class="text-gray-600 text-lg mt-6 max-w-xl">A technology company delivering sustainable, high-quality digital solutions that help businesses thrive.</p>

        <div class="mt-12 flex flex-col md:flex-row items-center gap-3 md:gap-8 text-gray-500 text-sm">
            <a href="mailto:leafbyteafinara@outlook.com" class="hover:text-primary transition-colors">leafbyteafinara@outlook.com</a>
            <span class="hidden md:block w-1 h-1 bg-gray-300 rounded-full"></span>
            <a href="tel:+628192660848" class="hover:text-primary transition-colors">+62 819 266 0848</a>
        </div>
    </main>

    <script>
        const translations = {
            en: {
                title: 'PT Leaf Byte Afinara - Technology That Grows, Solutions That Thrive',
                tagline: 'Technology That Grows, Solutions That Thrive',
                lede: 'A technology company delivering sustainable, high-quality digital solutions that help businesses thrive.'
            },
            id: {
                title: 'PT Leaf Byte Afinara - Teknologi yang Tumbuh, Solusi yang Berkembang',
                tagline: 'Teknologi yang Tumbuh, Solusi yang Berkembang',
                lede: 'Perusahaan teknologi yang menghadirkan solusi digital berkualitas tinggi dan berkelanjutan untuk membantu bisnis berkembang.'
            }
        };

        const buttons = document.querySelectorAll('[data-lang-btn]');

        function applyLanguage(lang) {
            const dict = translations[lang] || translations.en;
            document.documentElement.lang = lang === 'id' ? 'id' : 'en';
            document.title = dict.title;
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            buttons.forEach((btn) => {
                const active = btn.getAttribute('data-lang-btn') === lang;
                btn.classList.toggle('bg-primary', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('text-gray-500', !active);
            });
            localStorage.setItem('leafbyte-lang', lang);
        }

        const saved = localStorage.getItem('leafbyte-lang');
        const browserLang = (navigator.language || 'en').toLowerCase();
        applyLanguage(saved || (browserLang.startsWith('id') ? 'id' : 'en'));

        buttons.forEach((btn) => {
            btn.addEventListener('click', () => applyLanguage(btn.getAttribute('data-lang-btn')));
        });
    </script>
</body>
</html>
